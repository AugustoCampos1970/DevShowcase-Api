services:
  - type: web
    name: devshowcase-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devshowcase-db
          property: connectionString

databases:
  - name: devshowcase-db
    plan: free
    databaseName: devshowcase_db
